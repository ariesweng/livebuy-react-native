// Settings for the RN Android bridge's PURE-JVM test project (change:
// rn-android-jvm-test-gate, capability `local-ci-execution`).
//
// Deliberately a STANDALONE single-project build, and deliberately NOT part of
// `android/settings.gradle`:
//
//   • The sibling `../build.gradle` is an AGP library module for RN autolinking.
//     Including it in any settings.gradle of this repo would require an AGP +
//     Kotlin buildscript classpath and a resolvable `com.facebook.react:
//     react-android` — exactly what that module deliberately does NOT declare
//     (its version is injected by the RN host). See ../build.gradle:23-29.
//   • This project applies ONLY the Kotlin JVM plugin, so it must not inherit
//     `android/build.gradle`'s AGP buildscript either.
//
// Run it from the repo root with the repo's existing wrapper:
//
//   android/gradlew -p react-native/android/jvm-test test
//
rootProject.name = "livebuy-rn-android-jvm-test"
